[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portscanner"
version = "1.0.0"
description = "Advanced asynchronous port scanner for authorized security testing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "XSS.PUSHPENSH" }]
keywords = ["security", "portscanner", "asyncio", "reconnaissance", "pentesting"]
dependencies = [
    "scapy>=2.5.0",
    "aiofiles>=23.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
portscanner = "portscanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
